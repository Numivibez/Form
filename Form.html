<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main>
        <section class="form-section">
            <div class="form-container">
                <div class="form-side">
                    <div class="form-header">
                        <img src="img/numi-9.png" alt="Company Logo" class="logo">
                    </div>            
                </div>
                
                <div class="form-content">
                    <form id="signupForm" novalidate>
                        <h3>Sign Up</h3>
                        
                        <div class="input-group">
                            <label for="fname">First Name:</label>
                            <input type="text" id="fname" name="fname" placeholder="Jon" required>
                        </div>

                        <div class="input-group">
                            <label for="lname">Last Name:</label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="qwerty@gmail.com" required>
                        </div>

                        <div class="input-group">
                            <label for="phone">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" placeholder="080123456789" required>
                        </div>

                        <div class="input-group">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="confirm-password">Confirm Password:</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </div>
                        
                        <button type="submit">Submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
