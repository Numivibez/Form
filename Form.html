<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main>
        <section class="form-section">
            <div class="form-container">
                <div class="form-side">
                    <div class="form-header">
                        <img src="img/numi-9.png" alt="Company Logo" class="logo">
                    </div>            
                </div>
                
                <div class="form-content">
                    <form id="signupForm" novalidate>
                        <h3>Sign Up</h3>
                        
                        <div class="input-group">
                            <label for="fname">First Name:</label>
                            <input type="text" id="fname" name="fname" placeholder="Jon" aria-describedby="fname-error" required>
                            <div id="fname-error" class="error-message" aria-live="polite"></div>
                        </div>

                        <div class="input-group">
                            <label for="lname">Last Name:</label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" aria-describedby="lname-error" required>
                            <div id="lname-error" class="error-message" aria-live="polite"></div>
                        </div>
                        
                        <div class="input-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="qwerty@gmail.com" aria-describedby="email-error" required>
                            <div id="email-error" class="error-message" aria-live="polite"></div>
                        </div>

                        <div class="input-group">
                            <label for="phone">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" placeholder="080123456789" aria-describedby="phone-error" required>
                            <div id="phone-error" class="error-message" aria-live="polite"></div>
                        </div>

                        <div class="input-group">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" aria-describedby="password-error" required>
                            <div id="password-error" class="error-message" aria-live="polite"></div>
                        </div>
                        
                        <div class="input-group">
                            <label for="confirm-password">Confirm Password:</label>
                            <input type="password" id="confirm-password" name="confirm-password" aria-describedby="confirm-password-error" required>
                            <div id="confirm-password-error" class="error-message" aria-live="polite"></div>
                        </div>
                        
                        <button type="submit">Submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
